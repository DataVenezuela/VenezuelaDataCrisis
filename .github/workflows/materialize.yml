name: Materialize

# Materializer standalone (#336, ADR 0011): proyecta aportes -> filas proxy
# tipadas (persons/acopio_centers/events). No actua sobre los datos, asi que
# no vive dentro del cron de consolidate. La señal de fallo es a nivel CLI
# (Materialize summary + exit 1 en scrapers/cli.py), no un step del workflow.

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (offset nominal del 5,25,45 de consolidate;
                             # GitHub no garantiza puntualidad, el solapamiento es posible)
  workflow_dispatch: {}

concurrency:
  group: materialize
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Dry-run materialize (verificación)
        # --dry-run es un no-op garantizado a nivel CLI (config None: sin
        # cliente, sin red, sin escrituras) y ademas no se pasan credenciales.
        # Valida config, project.event_id y el wiring del subcomando antes de
        # la corrida real.
        run: |
          python -m scrapers.cli materialize \
            --dry-run \
            --config scrapers/config/sources.custom.yaml

      - name: Run materializer
        # Sin --dry-run: si los secrets faltan o rotaron mal, el CLI corta con
        # FAILED + exit 1 en vez de un no-op verde indistinguible de una
        # corrida sana (la clase de fallo invisible de #333).
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_CONSOLIDATION_JWT: ${{ secrets.SUPABASE_CONSOLIDATION_JWT }}
        run: |
          set -o pipefail
          python -m scrapers.cli materialize \
            --config scrapers/config/sources.custom.yaml \
            2>&1 | tee materialize.log

      - name: Upload materialize log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # run_attempt evita el 409 de upload-artifact@v4 al re-correr un run
          # fallido (el nombre por run_number solo colisionaria entre intentos).
          name: materialize-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: materialize.log
          retention-days: 7
